name: Publish desktop preview
on:
  workflow_run:
    workflows: [Desktop installers]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop installers run ID
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify completed build
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build.json
          test "$(jq -r .conclusion build.json)" = success
          test "$(jq -r .name build.json)" = 'Desktop installers'
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if test "$(jq -r .head_sha build.json)" != "$latest"; then
            echo 'A newer commit exists; skip publishing this older build.'
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          echo "BUILD_SHA=$(jq -r .head_sha build.json)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.verify.outputs.eligible == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          pattern: Xiaozhou-*
          merge-multiple: true
          path: installers
      - name: Publish installers
        if: steps.verify.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.1.0 already exists; existing release assets are not overwritten.'
            exit 0
          fi
          cd installers
          sha256sum * > SHA256SUMS
          cd ..
          cat > notes.md <<'NOTES'
          小舟桌面预览版，自带运行环境、专用 Chromium 与离线 OCR。

          - Windows x64：下载 .exe
          - macOS：按 Apple Silicon (arm64) 或 Intel (x64) 下载 .dmg
          - Linux x64：下载 .deb 或 .AppImage
          - 新增停止 AI 调用、60 秒人工核对超时提交，以及刷新登录二维码按钮。

          每位使用者自行登录并填写自己的 API Key。安装包不包含开发者的登录信息、课程链接或密钥。
          当前为未签名预览版；不能保证所有课程及 Linux 发行版兼容。AI 答案仍可能出错。
          NOTES
          gh release create v1.1.0 installers/* --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title '小舟 v1.1.0 桌面预览版' --prerelease --notes-file notes.md
