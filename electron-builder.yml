appId: cn.xiaozhou.studyassistant
productName: Xiaozhou
icon: .vendor/icon.png
asar: false
directories:
  output: dist
files:
  - desktop/**/*
  - src/**/*
  - public/**/*
  - examples/**/*
  - package.json
  - LICENSE
  - DISCLAIMER.md
  - THIRD_PARTY_NOTICES.md
extraResources:
  - from: .vendor/browsers
    to: browsers
    filter:
      - '**/*'
      - '!.links/**'
  - from: .vendor/native
    to: native
    filter:
      - '**/*'
artifactName: '${productName}-${version}-${os}-${arch}.${ext}'
mac:
  category: public.app-category.education
  target:
    - dmg
    - zip
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  category: Education
  maintainer: LOIIIIIII <LOIIIIIII@users.noreply.github.com>
  target:
    - AppImage
    - deb
